version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  minio-initialization:
    image: minio/mc:latest
    tty: true
    container_name: minio-initialization
    depends_on:
      - minio
      - postgres   # добавлено, чтобы дождаться postgres перед настройкой уведомлений
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
        echo 'Waiting for MinIO...';
        until mc alias set minio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} 2>/dev/null; do
          echo '   MinIO not ready yet...';
          sleep 2;
        done;
      
        mc mb minio/raw-vcf-files --ignore-existing;
        mc mb minio/parquet-files --ignore-existing;
        mc mb minio/iceberg-files --ignore-existing;
        mc mb minio/sandbox --ignore-existing;
      
        mc admin config set minio notify_postgres:stage-minio-vcf connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"stage_vcf_raw\" format=\"access\";
        mc admin config set minio notify_postgres:ods-minio-vcf connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"ods_vcf_raw\" format=\"namespace\";
      
        mc admin config set minio notify_postgres:stage-minio-parquet connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"stage_parquet_raw\" format=\"access\";
        mc admin config set minio notify_postgres:ods-minio-parquet connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"ods_parquet_raw\" format=\"namespace\";
      
        mc admin config set minio notify_postgres:stage-minio-iceberg connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"stage_iceberg_raw\" format=\"access\";
        mc admin config set minio notify_postgres:ods-minio-iceberg connection_string=\"user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} host=${POSTGRES_HOST} dbname=${POSTGRES_DB} port=5432\" table=\"ods_iceberg_raw\" format=\"namespace\";
      
        mc admin service restart minio;
      
        mc event remove minio/raw-vcf-files --force 2>/dev/null || true;
        mc event remove minio/parquet-files --force 2>/dev/null || true;
        mc event remove minio/iceberg-files --force 2>/dev/null || true;
      
        mc event add minio/raw-vcf-files arn:minio:sqs::stage-minio-vcf:postgresql --event put,delete,get;
        mc event add minio/raw-vcf-files arn:minio:sqs::ods-minio-vcf:postgresql --event put,delete,get;
      
        mc event add minio/parquet-files arn:minio:sqs::stage-minio-parquet:postgresql --event put,delete,get;
        mc event add minio/parquet-files arn:minio:sqs::ods-minio-parquet:postgresql --event put,delete,get;
      
        mc event add minio/iceberg-files arn:minio:sqs::stage-minio-iceberg:postgresql --event put,delete,get;
        mc event add minio/iceberg-files arn:minio:sqs::ods-minio-iceberg:postgresql --event put,delete,get;
      "
    restart: on-failure

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    ports:
      - "8124:8123"
      - "9003:9000"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    restart: unless-stopped

  airflow:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.airflow
    mem_limit: 20G
    container_name: airflow
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy   # ждём, пока postgres станет готов
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/scripts:/opt/airflow/scripts
      - ../airflow/plugins:/opt/airflow/plugins
      - ../airflow/configs:/opt/airflow/configs
      - ../airflow/requirements.txt:/opt/airflow/requirements.txt
      # - ../airflow/airflow.db:/opt/airflow/airflow.db   # можно закомментировать, больше не нужен
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW_USER: ${AIRFLOW_USER}
      AIRFLOW_PASSWORD: ${AIRFLOW_PASSWORD}
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_SEC: "600"
      AIRFLOW__SCHEDULER__TASK_INSTANCE_HEARTBEAT_TIMEOUT: "1800"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/$airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: 32
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: 2
    command: >
      bash -c "
        # Ждём, пока postgres будет доступен (хотя depends_on уже гарантирует, но для уверенности)
        echo 'Waiting for Postgres...' &&
        airflow db init &&
        pip install --no-cache-dir -r /opt/airflow/requirements.txt &&
        (airflow users list | grep -q ${AIRFLOW_USER} 2>/dev/null || 
         airflow users create --username ${AIRFLOW_USER} --password ${AIRFLOW_PASSWORD} --firstname Admin --lastname User --role Admin --email admin@example.com) &&
        airflow webserver & 
        airflow scheduler
      "
    restart: unless-stopped

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-postgres_data}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-minio_data}
  clickhouse_data:
    name: ${CLICKHOUSE_VOLUME_NAME:-clickhouse_data}